# TOEFL House ERP v3 — Docker Compose for Local Development
# Per 13_INFRASTRUCTURE_AND_DEPLOYMENT.md §4: optional convenience, not production

services:
  # MySQL 8
  mysql:
    image: mysql:8.0
    container_name: toefl-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: toefl_house_v3
      MYSQL_USER: toefl
      MYSQL_PASSWORD: toefl_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # Redis
  redis:
    image: redis:7-alpine
    container_name: toefl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Mailpit (email testing — replaces v2's nonexistent mail setup)
  mailpit:
    image: axllent/mailpit
    container_name: toefl-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP

volumes:
  mysql_data:
  redis_data:
